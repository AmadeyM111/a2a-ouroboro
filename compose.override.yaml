services:
  agent1:
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      A2A_AGENT_ID: agent1
      A2A_GATEWAY_URL: http://gateway:8080
      A2A_GATEWAY_TOKEN: ${AGENT1_A2A_TOKEN}
      A2A_KEY_ID: agent1-${A2A_KEY_SUFFIX:-2026-01}
      A2A_ED25519_PRIVATE_KEY_PATH: /run/secrets/a2a/ed25519-private.pem
      A2A_X25519_PRIVATE_KEY_PATH: /run/secrets/a2a/x25519-private.pem
      A2A_PUBLIC_REGISTRY_PATH: /run/secrets/a2a/public-keys.json
      A2A_RECIPIENT_KEY_IDS_JSON: '{"agent2":"agent2-${A2A_KEY_SUFFIX:-2026-01}","agent3":"agent3-${A2A_KEY_SUFFIX:-2026-01}","agent4":"agent4-${A2A_KEY_SUFFIX:-2026-01}","agent5":"agent5-${A2A_KEY_SUFFIX:-2026-01}"}'

    volumes:
      - ./skills/a2a_gateway:/data/skills/a2a_gateway:ro
      - ./secrets/a2a/agent1/ed25519-private.pem:/run/secrets/a2a/ed25519-private.pem:ro
      - ./secrets/a2a/agent1/x25519-private.pem:/run/secrets/a2a/x25519-private.pem:ro
      - ./secrets/a2a/public-keys.json:/run/secrets/a2a/public-keys.json:ro

