      - agent5-workspace:/workspace
      - ./skills/a2a_gateway:/data/skills/a2a_gateway:ro
      - ${A2A_KEYS_DIR:-./secrets/a2a}/agent5/ed25519-private.pem:/run/secrets/a2a/ed25519-private.pem:ro
      - ${A2A_KEYS_DIR:-./secrets/a2a}/agent5/x25519-private.pem:/run/secrets/a2a/x25519-private.pem:ro
      - ${A2A_KEYS_DIR:-./secrets/a2a}/public-keys.json:/run/secrets/a2a/public-keys.json:ro

