    security_opt:
      - no-new-privileges:true

  gateway:
      build:
        context: ./gateway
      image: bank-a2a-gateway:0.1.0
      container_name: bank-a2a-gateway
      restart: unless-stopped

      ports:
        - "127.0.0.1:8300:8080"

      environment:
        A2A_DATABASE_PATH: /data/gateway.db
        AGENT1_A2A_TOKEN: ${AGENT1_A2A_TOKEN}
        AGENT2_A2A_TOKEN: ${AGENT2_A2A_TOKEN}
        AGENT3_A2A_TOKEN: ${AGENT3_A2A_TOKEN}
        AGENT4_A2A_TOKEN: ${AGENT4_A2A_TOKEN}
        AGENT5_A2A_TOKEN: ${AGENT5_A2A_TOKEN}

      volumes:
        - gateway-data:/data

      networks:
        - bank-a2a-private

      security_opt:
        - no-new-privileges:true

      healthcheck:
        test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
        interval: 5s
        timeout: 3s
        retries: 12

volumes:
  agent1-data:
  agent1-workspace:
  agent2-data:
  agent2-workspace:
  agent3-data:
  agent3-workspace:
  agent4-data:
  agent4-workspace:
  agent5-data:
  agent5-workspace:
  gateway-data:

networks:
  bank-a2a-private:
    driver: bridge
