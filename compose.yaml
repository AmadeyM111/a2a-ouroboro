name: bank-a2a

services:
  agent1:
    image: a2a-ouroboros:6.40.0
    container_name: bank-a2a-agent1
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy

    ports:
      - "127.0.0.1:8201:8765"

    environment:
      OUROBOROS_NETWORK_PASSWORD: ${AGENT1_PASS}
      OUROBOROS_FILE_BROWSER_DEFAULT: /workspace
      OUROBOROS_DATA_DIR: /data
      OUROBOROS_MAX_WORKERS: "1"
      OUROBOROS_MAX_ACTIVE_SUBAGENTS_PER_ROOT: "1"
      OUROBOROS_MAX_SUBAGENT_DEPTH: "1"
      OUROBOROS_WORKER_START_METHOD: "spawn"

      A2A_AGENT_ID: agent1
      A2A_KEY_ID: agent1-${A2A_KEY_SUFFIX:-2026-01}
      A2A_GATEWAY_URL: http://gateway:8080
      A2A_GATEWAY_TOKEN: ${AGENT1_A2A_TOKEN}
      A2A_ED25519_PRIVATE_KEY_PATH: /run/secrets/a2a/ed25519-private.pem
      A2A_X25519_PRIVATE_KEY_PATH: /run/secrets/a2a/x25519-private.pem
      A2A_PUBLIC_REGISTRY_PATH: /run/secrets/a2a/public-keys.json
      A2A_RECIPIENT_KEY_IDS_JSON: '{"agent2":"agent2-${A2A_KEY_SUFFIX:-2026-01}","agent3":"agent3-${A2A_KEY_SUFFIX:-2026-01}","agent4":"agent4-${A2A_KEY_SUFFIX:-2026-01}","agent5":"agent5-${A2A_KEY_SUFFIX:-2026-01}"}'

      BASE_URL: http://host.docker.internal:8080/v1
      OPENAI_BASE_URL: http://host.docker.internal:8080/v1
      OPENAI_API_KEY: "local"

      OUROBOROS_MODEL: openai-compatible::gpt-oss-120b
      OUROBOROS_MODEL_HEAVY: openai-compatible::gpt-oss-120b
      OUROBOROS_MODEL_LIGHT: openai-compatible::gpt-oss-120b
      OUROBOROS_MODEL_FALLBACK: openai-compatible::gpt-oss-120b
      OUROBOROS_MODEL_RESERVE: openai-compatible::gpt-oss-120b
      LOCAL_MODEL_CONTEXT_LENGTH: "65536"
      MAX_TOKENS: "2048"
      OUROBOROS_MODEL_MAX_CONCURRENCY: "1"

      AGENT_ID: agent1
      AGENT_DISPLAY_NAME: "Герман"
      AGENT_OWNER_ID: user1

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - agent1-data:/data
      - agent1-workspace:/workspace
      - ./skills/a2a_gateway:/data/skills/a2a_gateway:ro
      - ${A2A_KEYS_DIR:-./secrets/a2a}/agent1/ed25519-private.pem:/run/secrets/a2a/ed25519-private.pem:ro
      - ${A2A_KEYS_DIR:-./secrets/a2a}/agent1/x25519-private.pem:/run/secrets/a2a/x25519-private.pem:ro
      - ${A2A_KEYS_DIR:-./secrets/a2a}/public-keys.json:/run/secrets/a2a/public-keys.json:ro

    networks:
      - bank-a2a-private

    security_opt:
      - no-new-privileges:true

  agent2:
    image: a2a-ouroboros:6.40.0
    container_name: bank-a2a-agent2
    restart: unless-stopped
