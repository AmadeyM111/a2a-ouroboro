      A2A_PUBLIC_REGISTRY_PATH: /run/secrets/a2a/public-keys.json
      A2A_RECIPIENT_KEY_IDS_JSON: '{"agent1":"agent1-${A2A_KEY_SUFFIX:-2026-01}","agent3":"agent3-${A2A_KEY_SUFFIX:-2026-01}","agent4":"agent4-${A2A_KEY_SUFFIX:-2026-01}","agent5":"agent5-${A2A_KEY_SUFFIX:-2026-01}"}'

      BASE_URL: http://host.docker.internal:8080/v1
      OPENAI_API_KEY: "local"
      OUROBOROS_MODEL: openai-compatible::gpt-oss-120b
      OUROBOROS_MODEL_HEAVY: openai-compatible::gpt-oss-120b
      OUROBOROS_MODEL_LIGHT: openai-compatible::gpt-oss-120b
      LOCAL_MODEL_CONTEXT_LENGTH: "65536"
      MAX_TOKENS: "2048"
      OUROBOROS_MODEL_MAX_CONCURRENCY: "1"

      AGENT_ID: agent2
      AGENT_DISPLAY_NAME: "Андрей"
      AGENT_OWNER_ID: user2


    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - agent2-data:/data
      - agent2-workspace:/workspace
      - ./skills/a2a_gateway:/data/skills/a2a_gateway:ro
      - ${A2A_KEYS_DIR:-./secrets/a2a}/agent2/ed25519-private.pem:/run/secrets/a2a/ed25519-private.pem:ro
      - ${A2A_KEYS_DIR:-./secrets/a2a}/agent2/x25519-private.pem:/run/secrets/a2a/x25519-private.pem:ro
      - ${A2A_KEYS_DIR:-./secrets/a2a}/public-keys.json:/run/secrets/a2a/public-keys.json:ro

