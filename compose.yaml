    container_name: bank-a2a-agent5
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy

    ports:
      - "127.0.0.1:8205:8765"

    environment:
      OUROBOROS_NETWORK_PASSWORD: ${AGENT5_PASS}
      OUROBOROS_FILE_BROWSER_DEFAULT: /workspace
      OUROBOROS_DATA_DIR: /data
      OUROBOROS_MAX_WORKERS: "1"
      OUROBOROS_MAX_ACTIVE_SUBAGENTS_PER_ROOT: "1"
      OUROBOROS_MAX_SUBAGENT_DEPTH: "1"
      OUROBOROS_WORKER_START_METHOD: "spawn"

      A2A_AGENT_ID: agent5
      A2A_KEY_ID: agent5-${A2A_KEY_SUFFIX:-2026-01}
